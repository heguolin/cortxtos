services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # 容器默认 UTC 会让定时任务整体偏移 8 小时；对齐北京时间
      TZ: Asia/Shanghai
    volumes:
      - ./data:/data
    expose:
      - "3000"
    # 仅本机回环：供服务器上 SSH 隧道调试，不暴露公网（公网入口只走 Caddy 443）
    ports:
      - "127.0.0.1:3000:3000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CORTEXT_DOMAIN: ${CORTEXT_DOMAIN:-cortxt.hgl123.icu}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
